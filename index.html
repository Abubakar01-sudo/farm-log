<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E5B3A">
<title>Farm Log</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#F6F8F3;--ink:#14231A;--muted:#5B6A60;--line:#D3DBCF;--yolk:#F0AE1B;--green:#1E5B3A;--red:#B3261E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main,header,nav{max-width:480px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;padding-bottom:0}
h1{font-size:30px;margin:24px 0 16px}
h2{font-size:20px;margin:0 0 4px}
label{display:block;margin:0 0 16px;color:var(--muted);font-size:16px}
input,select{display:block;width:100%;min-height:54px;margin-top:6px;padding:8px 12px;font:inherit;font-size:22px;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:8px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--green);outline-offset:2px}
button{font:inherit;cursor:pointer}
.primary{width:100%;min-height:56px;font-weight:700;color:var(--ink);background:var(--yolk);border:0;border-radius:8px}
.link{background:none;border:0;color:var(--green);padding:8px;font-size:16px;text-decoration:underline}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav button{flex:1 1 28%;min-height:48px;font-size:15px;padding:0 4px;background:#fff;border:2px solid var(--line);border-radius:8px;font-weight:600}
nav button.on{background:var(--green);border-color:var(--green);color:#fff}
.err{color:var(--red);font-weight:600}.ok{color:var(--green);font-weight:600}
section{background:#fff;border:2px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.big{font-size:56px;font-weight:800;line-height:1.1}.big small{font-size:18px;font-weight:600;color:var(--muted);margin-left:6px}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:8px 0 12px}.bar i{display:block;height:100%;background:var(--green)}
.row{display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:4px 0}
table{width:100%;border-collapse:collapse;font-size:16px}
th{text-align:left;color:var(--muted);font-weight:600}th,td{padding:6px 4px;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ====== PASTE YOUR VALUES (Supabase > Project Settings > API) ======
const SUPABASE_URL = 'https://vuesrzzaizuuypqiqsgh.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ulubCPXy-yxQ8C8TqgZxRA_Txf8Tpwc'; // never the secret / service_role key
// ===================================================================

const T = {
  en:{log:'Daily log',dash:'Production',pen:'Pen',date:'Date',eggs:'Eggs collected',feed:'Feed used (kg)',expenses:'Expenses (₦)',med:'Medication',trans:'Logistics / transport',exp7:'Expenses, last 7 days',dead:'Deaths',save:'Save entry',saved:'Saved.',hd:'hen-day',drop:'Production dropped by',pts:'points',nodata:'No entries yet.',nopens:'No pens set up yet.',signin:'Sign in',signout:'Sign out',email:'Email',pw:'Password',noFarm:'This account is not linked to a farm yet.',farm:'Farm',setup:'Set up your farm',fname:'Farm name',bag:'Feed bag size (kg)',price:'Feed price per bag (₦)',pname:'Pen name',birds:'Number of birds',addpen:'Add pen',close:'Close',create:'Create farm',update:'Update',pens:'Pens',confirmClose:'Close this pen? Its past entries are kept.',duties:'Duties',dnew:'New duty',dname:'Duty (e.g. Feed pens)',assignee:'Assigned to',dtime:'Due time',adddty:'Add duty',markdone:'Mark done',done:'Done',by:'by',overdue:'Overdue',undo:'Undo',remove:'Remove',nodut:'No duties yet.',of:'of',sales:'Sales',stype:'Item',t_eggs:'Eggs (crates)',t_hens:'Spent hens',t_manure:'Manure',t_other:'Other',qty:'Quantity',uprice:'Price each (₦)',buyer:'Buyer (optional)',addsale:'Save sale',total:'Total',recent:'Recent sales',sum7:'Last 7 days',sold:'Sales',spent:'Costs',net:'Net (estimate)',netnote:'Costs = feed + labour + medication + transport.',labour:'Monthly labour cost (₦)',nolabour:' Labour is not set (Farm tab).',nofeed:' Feed price is not set (Farm tab).',nosales:'No sales yet.',exptab:'Expenses',pay:'Payment method',p_cash:'Cash',p_transfer:'Bank transfer',p_other:'Other',recv:'Amount received (₦, blank = all)',owed:'Owed',markpaid:'Mark paid',category:'Category',desc:'Description',supplier:'Supplier',paid:'Amount paid (₦, blank = all)',amount:'Amount (₦)',owing:'You owe',owedtotal:'Customers owe you',addexp:'Save expense',noexp:'No expenses yet.',cat_feed:'Feed',cat_medication:'Medication / vaccination',cat_labour:'Labour / staff',cat_transport:'Transport / logistics',cat_utilities:'Electricity / water',cat_maintenance:'Equipment maintenance',cat_packaging:'Packaging',cat_admin:'Administrative',cat_other:'Other',recentexp:'Recent expenses',today:'Today',broken:'Broken eggs (part of the total above)',eused:'Eggs used or given away',brokenbig:'Broken eggs cannot be more than eggs collected.',openeggs:'Opening egg stock (crates)',crates:'crates',stockwarn:'You are selling more than the stock of',saveanyway:'Save anyway?',stock:'Egg stock',ostock:'Opening stock',produced:'Produced',brokenl:'Broken',usedl:'Used / given away',soldl:'Sold',cstock:'Closing stock',prodcost:'Production cost',cpc:'Cost per crate',avgp:'Average selling price per crate',mcrate:'Margin per crate',tmargin:'Total margin (crates sold)',prodcrates:'Crates produced',costnote:'Production cost = feed, labour, medication, transport and other costs, but not administrative costs.',moneytab:'Money',pl:'Profit and loss',revenue:'Egg and other sales',feedused:'Feed used',labourl:'Labour',opprofit:'Operating profit',hensl:'Spent hens sold (not operating income)',incl:'Result including spent hens',cf:'Cash flow',opening:'Opening cash balance (₦)',received:'Cash received',paidout:'Cash paid',closing:'Closing balance',from:'From',to:'To',d7:'7 days',d30:'30 days',mon:'This month',owedby:'Customers owe you (this period)',oweyou:'You owe suppliers (this period)',moneynote:'Profit counts feed by what the hens ate and uses the monthly labour amount if set. Cash flow counts money actually received and paid.'},
  ha:{log:'Rubuta na yau',dash:'Samarwa',pen:'Kwano',date:'Kwanan wata',eggs:'Kwai da aka tara',feed:'Abincin da aka yi amfani da (kg)',expenses:'Kashe-kashe (₦)',med:'Magani',trans:'Sufuri',exp7:'Kashe-kashe, kwanaki 7',dead:'Mutuwa',save:'Adana',saved:'An adana.',hd:'hen-day',drop:'Samar kwai ta ragu da',pts:'maki',nodata:'Babu bayani tukuna.',nopens:'Babu kwano tukuna.',signin:'Shiga',signout:'Fita',email:'Imel',pw:'Kalmar sirri',noFarm:'Ba a haɗa wannan asusu da gona ba tukuna.',farm:'Gona',setup:'Saita gonarka',fname:'Sunan gona',bag:'Nauyin buhun abinci (kg)',price:'Farashin buhu (₦)',pname:'Sunan kwano',birds:'Adadin kaji',addpen:'Ƙara kwano',close:'Rufe',create:'Ƙirƙiri gona',update:'Sabunta',pens:'Kwanuka',confirmClose:'Rufe wannan kwano? Bayanan baya za su kasance.',duties:'Ayyuka',dnew:'Sabon aiki',dname:'Aiki (misali: Ciyar da kaji)',assignee:'Wanda aka ba',dtime:'Lokaci',adddty:'Ƙara aiki',markdone:'An gama',done:'An yi',by:'daga',overdue:'Ya wuce lokaci',undo:'Soke',remove:'Cire',nodut:'Babu ayyuka tukuna.',of:'cikin',sales:'Tallace-tallace',stype:'Abu',t_eggs:'Kwai (crate)',t_hens:'Tsofaffin kaji',t_manure:'Taki',t_other:'Wani',qty:'Adadi',uprice:'Farashin ɗaya (₦)',buyer:'Mai saye (na zaɓi)',addsale:'Adana tallace',total:'Jimla',recent:'Tallace-tallace na kwanan nan',sum7:'Kwanaki 7 da suka wuce',sold:'Tallace',spent:'Kashe-kashe',net:'Riba (kimantawa)',netnote:'Kashe-kashe = abinci + albashi + magani + sufuri.',labour:'Albashin ma’aikata na wata (₦)',nolabour:' Ba a saka albashi ba (shafin Gona).',nofeed:' Ba a saka farashin abinci ba (shafin Gona).',nosales:'Babu tallace-tallace tukuna.',exptab:'Kashe-kashe',moneytab:'Kuɗi',today:'Yau'}
};
const SHOW_SUMMARY = false; // set to true to show the 'Last 7 days' sales/costs/net card on Results
const SHOW_DUTIES = false; // set to true to show the staff duty checklist tab
let lang = 'en', farm = null, pens = [], tab = 'log', role = 'worker';
try { lang = localStorage.getItem('lang') || 'en'; } catch (e) {}
const $ = s => document.querySelector(s);
const t = k => T[lang][k] || T.en[k] || k;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Africa/Lagos' });
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const langBtn = () => lang === 'en' ? 'Hausa' : 'English';
function flipLang() { lang = lang === 'en' ? 'ha' : 'en'; try { localStorage.setItem('lang', lang); } catch (e) {} }

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  session ? load() : renderLogin();
}

async function load() {
  const { data, error } = await sb.from('app_users').select('role, farms(id, name, bag_kg, feed_price_per_bag, monthly_labour, opening_cash, opening_eggs)').maybeSingle();
  if (error) { renderLogin(error.message); return; }
  if (!data) { renderSetup(); return; }
  farm = data.farms; role = data.role;
  await loadPens();
  tab = 'log';
  renderApp();
}

async function loadPens() {
  const r = await sb.from('flocks').select('id, pen_name').eq('status', 'active').order('pen_name');
  pens = r.data || [];
}

function renderSetup() {
  $('#app').innerHTML = `<main><h1>${t('setup')}</h1><form id="sf">
    <label>${t('fname')}<input id="sn" required></label>
    <label>${t('bag')}<input type="number" id="sb" inputmode="decimal" min="1" step="0.5" value="25" required></label>
    <label>${t('price')}<input type="number" id="sp" inputmode="decimal" min="0"></label>
    <label>${t('pname')}<input id="pn" value="Pen A" required></label>
    <label>${t('birds')}<input type="number" id="pb" inputmode="numeric" min="1" required></label>
    <p class="err" id="er"></p><button class="primary">${t('create')}</button></form>
    <button class="link" id="so">${t('signout')}</button></main>`;
  $('#so').onclick = async () => { await sb.auth.signOut(); renderLogin(); };
  $('#sf').onsubmit = async e => {
    e.preventDefault();
    const { data: id, error } = await sb.rpc('create_farm', {
      p_name: $('#sn').value.trim(), p_bag_kg: +$('#sb').value,
      p_feed_price: $('#sp').value === '' ? null : +$('#sp').value });
    if (error) { $('#er').textContent = error.message; return; }
    const r = await sb.from('flocks').insert({ farm_id: id, pen_name: $('#pn').value.trim(), starting_birds: +$('#pb').value, date_placed: today() });
    if (r.error) { $('#er').textContent = r.error.message; return; }
    load();
  };
}

function renderLogin(msg) {
  $('#app').innerHTML = `<main><h1>Farm Log</h1>
    <form id="lf"><label>${t('email')}<input type="email" id="em" required autocomplete="username"></label>
    <label>${t('pw')}<input type="password" id="pw" required autocomplete="current-password"></label>
    <p class="err" id="er">${msg ? esc(msg) : ''}</p><button class="primary">${t('signin')}</button></form>
    <button class="link" id="lg">${langBtn()}</button></main>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
    error ? $('#er').textContent = error.message : load();
  };
  $('#lg').onclick = () => { flipLang(); renderLogin(); };
}

function renderApp() {
  $('#app').innerHTML = `<header><b>${esc(farm.name)}</b><span><button class="link" id="lg">${langBtn()}</button><button class="link" id="so">${t('signout')}</button></span></header>
    <nav><button id="tl" class="${tab === 'log' ? 'on' : ''}">${t('log')}</button><button id="td" class="${tab === 'dash' ? 'on' : ''}">${t('dash')}</button><button id="ts" class="${tab === 'sales' ? 'on' : ''}">${t('sales')}</button><button id="te" class="${tab === 'exp' ? 'on' : ''}">${t('exptab')}</button><button id="tm" class="${tab === 'money' ? 'on' : ''}">${t('moneytab')}</button>${SHOW_DUTIES ? `<button id="tu" class="${tab === 'duty' ? 'on' : ''}">${t('duties')}</button>` : ''}${role === 'owner' ? `<button id="tf" class="${tab === 'farm' ? 'on' : ''}">${t('farm')}</button>` : ''}</nav><main id="v"></main>`;
  $('#lg').onclick = () => { flipLang(); renderApp(); };
  $('#so').onclick = async () => { await sb.auth.signOut(); renderLogin(); };
  $('#tl').onclick = () => { tab = 'log'; renderApp(); };
  $('#td').onclick = () => { tab = 'dash'; renderApp(); };
  if ($('#tf')) $('#tf').onclick = () => { tab = 'farm'; renderApp(); };
  $('#ts').onclick = () => { tab = 'sales'; renderApp(); };
  $('#te').onclick = () => { tab = 'exp'; renderApp(); };
  $('#tm').onclick = () => { tab = 'money'; renderApp(); };
  if ($('#tu')) $('#tu').onclick = () => { tab = 'duty'; renderApp(); };
  tab === 'log' ? viewLog() : tab === 'dash' ? viewDash() : tab === 'sales' ? viewSales() : tab === 'exp' ? viewExpenses() : tab === 'money' ? viewMoney() : tab === 'duty' ? viewDuties() : viewFarm();
}

function viewLog() {
  if (!pens.length) { $('#v').innerHTML = `<p>${t('nopens')}</p>`; return; }
  $('#v').innerHTML = `<form id="f">
    <label>${t('pen')}<select id="pen">${pens.map(p => `<option value="${p.id}">${esc(p.pen_name)}</option>`).join('')}</select></label>
    <label>${t('date')}<input type="date" id="dt" value="${today()}" required></label>
    <label>${t('eggs')}<input type="number" id="eg" inputmode="numeric" min="0" required></label>
    <label>${t('broken')}<input type="number" id="ek" inputmode="numeric" min="0"></label>
    <label>${t('eused')}<input type="number" id="eu" inputmode="numeric" min="0"></label>
    <label>${t('feed')}<input type="number" id="fd" inputmode="decimal" min="0" step="0.1" required></label>
    <label>${t('dead')}<input type="number" id="dd" inputmode="numeric" min="0" value="0" required></label>
    <h2 style="margin:24px 0 8px">${t('expenses')}</h2>
    <label>${t('med')}<input type="number" id="xm" inputmode="numeric" min="0"></label>
    <label>${t('trans')}<input type="number" id="xt" inputmode="numeric" min="0"></label>
    <p id="msg" role="status"></p><button class="primary">${t('save')}</button></form>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const { data: { user } } = await sb.auth.getUser();
    if ((+$('#ek').value || 0) > +$('#eg').value) { $('#msg').className = 'err'; $('#msg').textContent = t('brokenbig'); return; }
    const { error } = await sb.from('daily_logs').upsert({
      flock_id: $('#pen').value, log_date: $('#dt').value,
      eggs_good: +$('#eg').value - (+$('#ek').value || 0), eggs_cracked: +$('#ek').value || 0, eggs_used: +$('#eu').value || 0, feed_kg: +$('#fd').value,
      deaths: +$('#dd').value, entered_by: user.email
    }, { onConflict: 'flock_id,log_date' });
    let err = error;
    if (!err) {
      const rows = [['drugs', $('#xm').value], ['transport', $('#xt').value]].filter(r => r[1] !== '')
        .map(r => ({ flock_id: $('#pen').value, cost_date: $('#dt').value, type: r[0], amount: +r[1] }));
      if (rows.length) err = (await sb.from('costs').upsert(rows, { onConflict: 'flock_id,cost_date,type' })).error;
    }
    $('#msg').className = err ? 'err' : 'ok';
    $('#msg').textContent = err ? err.message : t('saved');
    if (!err) { $('#eg').value = ''; $('#fd').value = ''; $('#dd').value = 0; $('#xm').value = ''; $('#xt').value = ''; $('#ek').value = ''; $('#eu').value = ''; }
  };
}

async function viewDash() {
  $('#v').innerHTML = '<p>…</p>';
  let h = '';
  const from7 = new Date(Date.now() - 6 * 864e5).toLocaleDateString('en-CA', { timeZone: 'Africa/Lagos' });
  const fmt = n => '₦' + n.toLocaleString('en-NG');
  if (SHOW_SUMMARY) {
  const [sl, cs0, lg] = await Promise.all([
    sb.from('sales').select('quantity, unit_price').gte('sale_date', from7),
    sb.from('costs').select('amount').gte('cost_date', from7),
    sb.from('daily_logs').select('feed_kg').gte('log_date', from7)
  ]);
  const sold = (sl.data || []).reduce((a, x) => a + Number(x.quantity) * Number(x.unit_price), 0);
  const price = Number(farm.feed_price_per_bag) || 0;
  const feedCost = price ? (lg.data || []).reduce((a, x) => a + Number(x.feed_kg), 0) / Number(farm.bag_kg) * price : 0;
  const labourCost = (Number(farm.monthly_labour) || 0) * 7 / 30;
  const spent = (cs0.data || []).reduce((a, x) => a + Number(x.amount), 0) + feedCost + labourCost;
  const netv = Math.round(sold - spent);
  h += `<section><h2>${t('sum7')}</h2>
    <div class="row"><span>${t('sold')}</span><b>${fmt(Math.round(sold))}</b></div>
    <div class="row"><span>${t('spent')}</span><b>${fmt(Math.round(spent))}</b></div>
    <div class="row"><span>${t('net')}</span><b class="${netv < 0 ? 'err' : 'ok'}">${fmt(netv)}</b></div>
    <p style="color:var(--muted);font-size:14px;margin:8px 0 0">${t('netnote')}${price ? '' : t('nofeed')}${Number(farm.monthly_labour) ? '' : t('nolabour')}</p></section>`;
  }
  for (const p of pens) {
    const { data } = await sb.from('flock_daily').select('*').eq('flock_id', p.id)
      .order('log_date', { ascending: false }).limit(7);
    h += `<section><h2>${esc(p.pen_name)}</h2>`;
    if (!data || !data.length) { h += `<p>${t('nodata')}</p></section>`; continue; }
    const a = data[0], b = data[1];
    const d = b ? Math.round((a.hen_day_pct - b.hen_day_pct) * 10) / 10 : null;
    h += `<div class="big">${a.hen_day_pct}<small>% ${t('hd')}</small></div>
      <div class="bar"><i style="width:${Math.min(100, a.hen_day_pct)}%"></i></div>`;
    if (d !== null && d <= -5) h += `<p class="err">${t('drop')} ${Math.abs(d)} ${t('pts')}</p>`;
    h += `<table><tr><th>${t('date')}</th><th>${t('eggs')}</th><th>%</th><th>${t('dead')}</th></tr>` +
      data.map(r => `<tr><td>${r.log_date.slice(5)}</td><td>${r.eggs_good + r.eggs_cracked}</td><td>${r.hen_day_pct}</td><td>${r.deaths}</td></tr>`).join('') +
      `</table></section>`;
  }
  $('#v').innerHTML = h || `<p>${t('nopens')}</p>`;
}

async function viewSales() {
  $('#v').innerHTML = '<p>…</p>';
  const r = await sb.from('sales').select('id, sale_date, type, quantity, unit_price, buyer, amount_received')
    .order('sale_date', { ascending: false }).order('created_at', { ascending: false }).limit(15);
  if (r.error) { $('#v').innerHTML = `<p class="err">${esc(r.error.message)}</p>`; return; }
  const list = r.data || [];
  const money = n => '₦' + Math.round(n).toLocaleString('en-NG');
  const all = (await sb.from('sales').select('quantity, unit_price, amount_received')).data || [];
  const owedAll = all.reduce((a, x) => a + Number(x.quantity) * Number(x.unit_price) - Number(x.amount_received ?? Number(x.quantity) * Number(x.unit_price)), 0);
  const owedTag = x => { const o = x.quantity * x.unit_price - Number(x.amount_received ?? x.quantity * x.unit_price);
    return o > 0.5 ? `<span class="err">${t('owed')} ${money(o)}</span>${role === 'owner' ? `<button class="link" data-paid="${x.id}">${t('markpaid')}</button>` : ''}` : ''; };
  $('#v').innerHTML = `${owedAll > 0.5 ? `<p class="err">${t('owedtotal')}: ${money(owedAll)}</p>` : ''}<form id="sf2">
    <label>${t('date')}<input type="date" id="sd" value="${today()}" required></label>
    <label>${t('stype')}<select id="st"><option value="eggs">${t('t_eggs')}</option><option value="hens">${t('t_hens')}</option><option value="manure">${t('t_manure')}</option><option value="other">${t('t_other')}</option></select></label>
    <label>${t('qty')}<input type="number" id="sq" inputmode="decimal" min="0" step="any" required></label>
    <label>${t('uprice')}<input type="number" id="su" inputmode="decimal" min="0" step="any" required></label>
    <label>${t('buyer')}<input id="sbuy"></label>
    <label>${t('pay')}<select id="sp2"><option value="cash">${t('p_cash')}</option><option value="transfer">${t('p_transfer')}</option><option value="other">${t('p_other')}</option></select></label>
    <label>${t('recv')}<input type="number" id="sr" inputmode="decimal" min="0" step="any"></label>
    <p id="stot" style="font-weight:700"></p><p id="smsg" role="status"></p><button class="primary">${t('addsale')}</button></form>
    <h2 style="margin-top:28px">${t('recent')}</h2>` +
    (list.length ? list.map(x => `<div class="row"><span>${x.sale_date.slice(5)} · ${t('t_' + x.type)} ${Number(x.quantity)} × ${money(Number(x.unit_price))}${x.buyer ? ' · ' + esc(x.buyer) : ''}</span><b>${money(x.quantity * x.unit_price)}</b>${owedTag(x)}${role === 'owner' ? `<button class="link" data-del="${x.id}">✕</button>` : ''}</div>`).join('') : `<p>${t('nosales')}</p>`);
  const upd = () => { const v = +$('#sq').value * +$('#su').value; $('#stot').textContent = v ? `${t('total')}: ${money(v)}` : ''; };
  $('#sq').oninput = upd; $('#su').oninput = upd;
  $('#sf2').onsubmit = async e => {
    e.preventDefault();
    const { data: { user } } = await sb.auth.getUser();
    if ($('#st').value === 'eggs') { const st = await eggStock(); if (+$('#sq').value > st && !confirm(`${t('stockwarn')} ${Math.round(st * 10) / 10} ${t('crates')}. ${t('saveanyway')}`)) return; }
    const { error } = await sb.from('sales').insert({ farm_id: farm.id, sale_date: $('#sd').value, type: $('#st').value,
      quantity: +$('#sq').value, unit_price: +$('#su').value, buyer: $('#sbuy').value.trim() || null, created_by: user.email, payment_method: $('#sp2').value,
      amount_received: $('#sr').value === '' ? +$('#sq').value * +$('#su').value : +$('#sr').value });
    if (error) { $('#smsg').className = 'err'; $('#smsg').textContent = error.message; return; }
    await viewSales();
    $('#smsg').className = 'ok'; $('#smsg').textContent = t('saved');
  };
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm(t('remove') + '?')) return;
    await sb.from('sales').delete().eq('id', b.dataset.del);
    viewSales();
  });
  document.querySelectorAll('[data-paid]').forEach(b => b.onclick = async () => {
    const { data: r1 } = await sb.from('sales').select('quantity, unit_price').eq('id', b.dataset.paid).single();
    await sb.from('sales').update({ amount_received: r1.quantity * r1.unit_price }).eq('id', b.dataset.paid);
    viewSales();
  });
}

async function viewExpenses() {
  $('#v').innerHTML = '<p>…</p>';
  const r = await sb.from('expenses').select('id, expense_date, category, description, supplier, amount, amount_paid')
    .order('expense_date', { ascending: false }).order('created_at', { ascending: false }).limit(15);
  if (r.error) { $('#v').innerHTML = `<p class="err">${esc(r.error.message)}</p>`; return; }
  const list = r.data || [];
  const all = (await sb.from('expenses').select('amount, amount_paid')).data || [];
  const owe = all.reduce((a, x) => a + Number(x.amount) - Number(x.amount_paid), 0);
  const money = n => '₦' + Math.round(n).toLocaleString('en-NG');
  const cats = ['feed', 'medication', 'labour', 'transport', 'utilities', 'maintenance', 'packaging', 'admin', 'other'];
  $('#v').innerHTML = `${owe > 0.5 ? `<p class="err">${t('owing')}: ${money(owe)}</p>` : ''}<form id="ef">
    <label>${t('date')}<input type="date" id="ed" value="${today()}" required></label>
    <label>${t('category')}<select id="ec">${cats.map(c => `<option value="${c}">${t('cat_' + c)}</option>`).join('')}</select></label>
    <label>${t('desc')}<input id="ex"></label>
    <label>${t('amount')}<input type="number" id="ea" inputmode="decimal" min="0" step="any" required></label>
    <label>${t('supplier')}<input id="es"></label>
    <label>${t('paid')}<input type="number" id="ep" inputmode="decimal" min="0" step="any"></label>
    <p id="em" role="status"></p><button class="primary">${t('addexp')}</button></form>
    <h2 style="margin-top:28px">${t('recentexp')}</h2>` +
    (list.length ? list.map(x => { const o = Number(x.amount) - Number(x.amount_paid);
      return `<div class="row"><span>${x.expense_date.slice(5)} · ${t('cat_' + x.category)}${x.description ? ' · ' + esc(x.description) : ''}${x.supplier ? ' · ' + esc(x.supplier) : ''}</span><b>${money(x.amount)}</b>${o > 0.5 ? `<span class="err">${t('owing')} ${money(o)}</span>${role === 'owner' ? `<button class="link" data-paid="${x.id}">${t('markpaid')}</button>` : ''}` : ''}${role === 'owner' ? `<button class="link" data-del="${x.id}">✕</button>` : ''}</div>`; }).join('') : `<p>${t('noexp')}</p>`);
  $('#ef').onsubmit = async e => {
    e.preventDefault();
    const { data: { user } } = await sb.auth.getUser();
    const amt = +$('#ea').value;
    const { error } = await sb.from('expenses').insert({ farm_id: farm.id, expense_date: $('#ed').value, category: $('#ec').value,
      description: $('#ex').value.trim() || null, amount: amt, supplier: $('#es').value.trim() || null,
      amount_paid: $('#ep').value === '' ? amt : +$('#ep').value, created_by: user.email });
    if (error) { $('#em').className = 'err'; $('#em').textContent = error.message; return; }
    await viewExpenses();
    $('#em').className = 'ok'; $('#em').textContent = t('saved');
  };
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm(t('remove') + '?')) return;
    await sb.from('expenses').delete().eq('id', b.dataset.del);
    viewExpenses();
  });
  document.querySelectorAll('[data-paid]').forEach(b => b.onclick = async () => {
    const { data: r1 } = await sb.from('expenses').select('amount').eq('id', b.dataset.paid).single();
    await sb.from('expenses').update({ amount_paid: r1.amount }).eq('id', b.dataset.paid);
    viewExpenses();
  });
}

async function eggStock() {
  const [a, b] = await Promise.all([sb.from('daily_logs').select('eggs_good, eggs_used'), sb.from('sales').select('quantity').eq('type', 'eggs')]);
  const sm = (arr, f) => (arr || []).reduce((q, x) => q + Number(f(x)), 0);
  return Number(farm.opening_eggs || 0) + sm(a.data, x => x.eggs_good - x.eggs_used) / 30 - sm(b.data, x => x.quantity);
}

async function viewMoney(from = today().slice(0, 8) + '01', to = today()) {
  $('#v').innerHTML = '<p>…</p>';
  const [sl, ex, co, lg, p0, p1, p2, al, es] = await Promise.all([
    sb.from('sales').select('type, quantity, unit_price, amount_received').gte('sale_date', from).lte('sale_date', to),
    sb.from('expenses').select('category, amount, amount_paid').gte('expense_date', from).lte('expense_date', to),
    sb.from('costs').select('type, amount').gte('cost_date', from).lte('cost_date', to),
    sb.from('daily_logs').select('feed_kg').gte('log_date', from).lte('log_date', to),
    sb.from('sales').select('amount_received').lt('sale_date', from),
    sb.from('expenses').select('amount_paid').lt('expense_date', from),
    sb.from('costs').select('amount').lt('cost_date', from),
    sb.from('daily_logs').select('log_date, eggs_good, eggs_cracked, eggs_used').lte('log_date', to),
    sb.from('sales').select('sale_date, quantity').eq('type', 'eggs').lte('sale_date', to)
  ]);
  const N = Number, sum = (a, fn) => (a || []).reduce((q, x) => q + fn(x), 0);
  const val = x => N(x.quantity) * N(x.unit_price);
  const S = sl.data || [], E = ex.data || [];
  const rev = sum(S.filter(x => x.type !== 'hens'), val);
  const hens = sum(S.filter(x => x.type === 'hens'), val);
  const owedC = sum(S, x => val(x) - N(x.amount_received ?? val(x)));
  const days = Math.round((new Date(to) - new Date(from)) / 864e5) + 1;
  const price = N(farm.feed_price_per_bag) || 0;
  const feed = price ? sum(lg.data, x => N(x.feed_kg)) / N(farm.bag_kg) * price : 0;
  const lab = N(farm.monthly_labour) || 0;
  const labour = lab ? lab / 30 * days : sum(E.filter(x => x.category === 'labour'), x => N(x.amount));
  const byCat = {};
  E.forEach(x => { if (x.category !== 'feed' && x.category !== 'labour') byCat[x.category] = (byCat[x.category] || 0) + N(x.amount); });
  (co.data || []).forEach(x => { const c = x.type === 'drugs' ? 'medication' : x.type; if (c !== 'feed' && c !== 'labour') byCat[c] = (byCat[c] || 0) + N(x.amount); });
  const opex = feed + labour + Object.values(byCat).reduce((q, v) => q + v, 0);
  const profit = rev - opex;
  const recv = sum(S, x => N(x.amount_received ?? val(x)));
  const paid = sum(E, x => N(x.amount_paid)) + sum(co.data, x => N(x.amount));
  const open = N(farm.opening_cash) + sum(p0.data, x => N(x.amount_received)) - sum(p1.data, x => N(x.amount_paid)) - sum(p2.data, x => N(x.amount));
  const owedS = sum(E, x => N(x.amount) - N(x.amount_paid));
  const CR = 30, A = al.data || [], ES = es.data || [];
  const inP = a => a.filter(x => (x.log_date || x.sale_date) >= from);
  const prodE = sum(inP(A), x => N(x.eggs_good) + N(x.eggs_cracked)), brokenE = sum(inP(A), x => N(x.eggs_cracked)), usedE = sum(inP(A), x => N(x.eggs_used));
  const soldCr = sum(inP(ES), x => N(x.quantity));
  const openCr = N(farm.opening_eggs) + sum(A.filter(x => x.log_date < from), x => N(x.eggs_good) - N(x.eggs_used)) / CR - sum(ES.filter(x => x.sale_date < from), x => N(x.quantity));
  const closeCr = openCr + (prodE - brokenE - usedE) / CR - soldCr;
  const eggRev = sum(S.filter(x => x.type === 'eggs'), val);
  const prodCost = feed + labour + Object.keys(byCat).filter(c => c !== 'admin').reduce((q, c) => q + byCat[c], 0);
  const cpc = prodE ? prodCost / (prodE / CR) : 0, avgp = soldCr ? eggRev / soldCr : 0;
  const cr = n => (Math.round(n * 10) / 10).toLocaleString('en-NG') + ' ' + t('crates');
  const Q = (l, v, c) => `<div class="row"><span>${l}</span><b${c ? ` class="${c}"` : ''}>${v}</b></div>`;
  const money = n => '₦' + Math.round(n).toLocaleString('en-NG');
  const R = (l, v, c) => `<div class="row"><span>${l}</span><b${c ? ` class="${c}"` : ''}>${money(v)}</b></div>`;
  $('#v').innerHTML = `<label>${t('from')}<input type="date" id="mf" value="${from}"></label>
    <label>${t('to')}<input type="date" id="mt" value="${to}"></label>
    <nav style="padding:0 0 16px"><button id="m1">${t('today')}</button><button id="m7">${t('d7')}</button><button id="m30">${t('d30')}</button><button id="mm">${t('mon')}</button></nav>
    <section><h2>${t('pl')}</h2>${R(t('revenue'), rev)}${R(t('feedused'), feed)}${R(t('labourl'), labour)}` +
    Object.keys(byCat).map(c => R(t('cat_' + c), byCat[c])).join('') +
    `${R(t('opprofit'), profit, profit < 0 ? 'err' : 'ok')}${R(t('hensl'), hens)}${R(t('incl'), profit + hens)}</section>
    <section><h2>${t('cf')}</h2>${R(t('opening'), open)}${R(t('received'), recv)}${R(t('paidout'), paid)}${R(t('closing'), open + recv - paid, open + recv - paid < 0 ? 'err' : 'ok')}</section>
    <section><h2>${t('stock')}</h2>${Q(t('ostock'), cr(openCr))}${Q(t('produced'), cr(prodE / CR))}${Q(t('brokenl'), cr(brokenE / CR))}${Q(t('usedl'), cr(usedE / CR))}${Q(t('soldl'), cr(soldCr))}${Q(t('cstock'), cr(closeCr), closeCr < 0 ? 'err' : 'ok')}</section>
    <section><h2>${t('cpc')}</h2>${R(t('prodcost'), prodCost)}${Q(t('prodcrates'), cr(prodE / CR))}${R(t('cpc'), cpc)}${R(t('avgp'), avgp)}${R(t('mcrate'), avgp - cpc, avgp - cpc < 0 ? 'err' : 'ok')}${R(t('tmargin'), (avgp - cpc) * soldCr)}<p style="color:var(--muted);font-size:14px;margin:8px 0 0">${t('costnote')}</p></section>
    <section>${R(t('owedby'), owedC)}${R(t('oweyou'), owedS)}<p style="color:var(--muted);font-size:14px;margin:8px 0 0">${t('moneynote')}${price ? '' : t('nofeed')}</p></section>`;
  const go = (f, e) => viewMoney(f, e);
  const iso = d => d.toLocaleDateString('en-CA', { timeZone: 'Africa/Lagos' });
  $('#mf').onchange = $('#mt').onchange = () => go($('#mf').value, $('#mt').value);
  $('#m1').onclick = () => go(today(), today());
  $('#m7').onclick = () => go(iso(new Date(Date.now() - 6 * 864e5)), today());
  $('#m30').onclick = () => go(iso(new Date(Date.now() - 29 * 864e5)), today());
  $('#mm').onclick = () => go(today().slice(0, 8) + '01', today());
}

async function viewDuties() {
  $('#v').innerHTML = '<p>…</p>';
  const [d, c] = await Promise.all([
    sb.from('duties').select('id, name, assignee, due_time').eq('active', true).order('due_time', { ascending: true, nullsFirst: false }),
    sb.from('duty_checks').select('duty_id, done_at, done_by').eq('check_date', today())
  ]);
  if (d.error) { $('#v').innerHTML = `<p class="err">${esc(d.error.message)}</p>`; return; }
  const duties = d.data || [], checks = {};
  (c.data || []).forEach(x => checks[x.duty_id] = x);
  const hm = x => new Date(x).toLocaleTimeString('en-GB', { timeZone: 'Africa/Lagos', hour: '2-digit', minute: '2-digit' });
  const nowHm = hm(Date.now());
  const doneCount = duties.filter(x => checks[x.id]).length;
  let h = duties.length ? `<h2>${doneCount} ${t('of')} ${duties.length} ${t('done').toLowerCase()}</h2>` : `<p>${t('nodut')}</p>`;
  h += duties.map(x => {
    const k = checks[x.id];
    const late = !k && x.due_time && nowHm > x.due_time.slice(0, 5);
    return `<section><b>${esc(x.name)}</b><div style="color:var(--muted);font-size:16px">${x.assignee ? esc(x.assignee) : ''}${x.due_time ? ' · ' + x.due_time.slice(0, 5) : ''}</div>` +
      (k ? `<p class="ok">✓ ${t('done')} ${hm(k.done_at)} ${t('by')} ${esc(k.done_by || '')}</p>${role === 'owner' ? `<button class="link" data-undo="${x.id}">${t('undo')}</button>` : ''}`
         : `${late ? `<p class="err">${t('overdue')}</p>` : ''}<button class="primary" data-done="${x.id}">${t('markdone')}</button>`) +
      (role === 'owner' ? `<button class="link" data-rm="${x.id}">${t('remove')}</button>` : '') + `</section>`;
  }).join('');
  if (role === 'owner') h += `<form id="df" style="margin-top:20px"><h2>${t('dnew')}</h2>
    <label>${t('dname')}<input id="dn" required></label>
    <label>${t('assignee')}<input id="da"></label>
    <label>${t('dtime')}<input type="time" id="dt2"></label>
    <p id="dm" class="err"></p><button class="primary">${t('adddty')}</button></form>`;
  $('#v').innerHTML = h;
  document.querySelectorAll('[data-done]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const { data: { user } } = await sb.auth.getUser();
    await sb.from('duty_checks').insert({ duty_id: b.dataset.done, check_date: today(), done_by: user.email });
    viewDuties();
  });
  document.querySelectorAll('[data-undo]').forEach(b => b.onclick = async () => {
    await sb.from('duty_checks').delete().eq('duty_id', b.dataset.undo).eq('check_date', today());
    viewDuties();
  });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
    if (!confirm(t('remove') + '?')) return;
    await sb.from('duties').update({ active: false }).eq('id', b.dataset.rm);
    viewDuties();
  });
  if ($('#df')) $('#df').onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.from('duties').insert({ farm_id: farm.id, name: $('#dn').value.trim(), assignee: $('#da').value.trim() || null, due_time: $('#dt2').value || null });
    if (error) { $('#dm').textContent = error.message; return; }
    viewDuties();
  };
}

function viewFarm() {
  $('#v').innerHTML = `<form id="ff"><h2>${t('farm')}</h2>
    <label>${t('bag')}<input type="number" id="bg" inputmode="decimal" min="1" step="0.5" value="${farm.bag_kg}" required></label>
    <label>${t('price')}<input type="number" id="pr" inputmode="decimal" min="0" value="${farm.feed_price_per_bag ?? ''}"></label>
    <label>${t('labour')}<input type="number" id="lb" inputmode="numeric" min="0" value="${farm.monthly_labour ?? ''}"></label>
    <label>${t('opening')}<input type="number" id="oc" inputmode="decimal" value="${farm.opening_cash ?? 0}"></label>
    <label>${t('openeggs')}<input type="number" id="oe" inputmode="decimal" min="0" step="any" value="${farm.opening_eggs ?? 0}"></label>
    <p id="fm" role="status"></p><button class="primary">${t('update')}</button></form>
    <h2 style="margin-top:28px">${t('pens')}</h2>
    ${pens.map(p => `<div class="row"><span>${esc(p.pen_name)}</span><button class="link" data-id="${p.id}">${t('close')}</button></div>`).join('')}
    <form id="pf" style="margin-top:16px"><label>${t('pname')}<input id="pn" required></label>
    <label>${t('birds')}<input type="number" id="pb" inputmode="numeric" min="1" required></label>
    <p id="pm" role="status"></p><button class="primary">${t('addpen')}</button></form>`;
  $('#ff').onsubmit = async e => {
    e.preventDefault();
    const price = $('#pr').value === '' ? null : +$('#pr').value;
    const lab = $('#lb').value === '' ? null : +$('#lb').value;
    const { error } = await sb.from('farms').update({ bag_kg: +$('#bg').value, feed_price_per_bag: price, monthly_labour: lab, opening_cash: +$('#oc').value || 0, opening_eggs: +$('#oe').value || 0 }).eq('id', farm.id);
    $('#fm').className = error ? 'err' : 'ok';
    $('#fm').textContent = error ? error.message : t('saved');
    if (!error) { farm.bag_kg = +$('#bg').value; farm.feed_price_per_bag = price; farm.monthly_labour = lab; farm.opening_cash = +$('#oc').value || 0; farm.opening_eggs = +$('#oe').value || 0; }
  };
  $('#pf').onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.from('flocks').insert({ farm_id: farm.id, pen_name: $('#pn').value.trim(), starting_birds: +$('#pb').value, date_placed: today() });
    if (error) { $('#pm').className = 'err'; $('#pm').textContent = error.message; return; }
    await loadPens(); viewFarm();
  };
  document.querySelectorAll('[data-id]').forEach(b => b.onclick = async () => {
    if (!confirm(t('confirmClose'))) return;
    const { error } = await sb.from('flocks').update({ status: 'closed' }).eq('id', b.dataset.id);
    if (!error) { await loadPens(); viewFarm(); }
  });
}
