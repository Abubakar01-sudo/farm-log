<style>
:root{--bg:#F6F8F3;--ink:#14231A;--muted:#5B6A60;--line:#D3DBCF;--card:#fff;--yolk:#F0AE1B;--green:#1E5B3A;--red:#B3261E;--alb:#FBE9E7;--alc:#B3261E;--awb:#FFF4DB;--awc:#7A5200;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A14;--ink:#E8EFE9;--muted:#9FB0A5;--line:#2E4036;--card:#16231C;--green:#3FA56A;--red:#FF8A80;--alb:#3A1E1B;--alc:#FF8A80;--awb:#3A2F12;--awc:#F0C050;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A14;--ink:#E8EFE9;--muted:#9FB0A5;--line:#2E4036;--card:#16231C;--green:#3FA56A;--red:#FF8A80;--alb:#3A1E1B;--alc:#FF8A80;--awb:#3A2F12;--awc:#F0C050;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main,header,nav{max-width:480px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;padding-bottom:0}
h1{font-size:30px;margin:24px 0 16px}
h2{font-size:20px;margin:0 0 4px}
label{display:block;margin:0 0 16px;color:var(--muted);font-size:16px}
input,select{display:block;width:100%;min-height:54px;margin-top:6px;padding:8px 12px;font:inherit;font-size:22px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:8px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--green);outline-offset:2px}
button{font:inherit;cursor:pointer}
.primary{width:100%;min-height:56px;font-weight:700;color:#14231A;background:var(--yolk);border:0;border-radius:8px}
.link{background:none;border:0;color:var(--green);padding:8px;font-size:16px;text-decoration:underline}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav button{flex:1 1 28%;min-height:48px;font-size:15px;padding:0 4px;background:var(--card);border:2px solid var(--line);border-radius:8px;font-weight:600}
nav button.on{background:var(--green);border-color:var(--green);color:#fff}
.err{color:var(--red);font-weight:600}.ok{color:var(--green);font-weight:600}
section{background:var(--card);border:2px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.big{font-size:56px;font-weight:800;line-height:1.1}.big small{font-size:18px;font-weight:600;color:var(--muted);margin-left:6px}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:8px 0 12px}.bar i{display:block;height:100%;background:var(--green)}
.row{display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:4px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.m{background:var(--card);border:2px solid var(--line);border-radius:8px;padding:10px}.m small{display:block;color:var(--muted);font-size:14px}.m b{font-size:20px}
.al{background:var(--alb);color:var(--alc);padding:8px 12px;border-radius:8px;margin:0 0 8px;font-size:16px;font-weight:600}.al.w{background:var(--awb);color:var(--awc)}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px}.bars>div{flex:1;display:flex;align-items:flex-end;gap:1px;height:100%}.bars i{display:block;flex:1;min-height:1px}
@media print{nav,header,button,.tabbar,.noprint{display:none!important}}
.shell{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:480px;margin:0 auto}
.shell>header{flex:none;width:100%}.shell>main{flex:1;min-height:0;overflow-y:auto;width:100%}
.tabbar{flex:none;display:flex;background:var(--card);border-top:2px solid var(--line);padding:6px 4px max(10px, env(safe-area-inset-bottom))}
.tabbar button{flex:1;border:0;background:none;font-size:12px;color:var(--muted);padding:2px 0}
.tabbar button.on{color:var(--green);font-weight:700}
.tabbar .ic{display:block;font-size:22px;line-height:1.2}
#v{padding-bottom:24px}
@media print{.shell{height:auto;display:block}.shell>main{overflow:visible}}
.st{display:flex;gap:8px;align-items:center}.st input{margin-top:0;text-align:center}
.stp{min-width:56px;min-height:54px;font-size:26px;border:2px solid var(--line);background:var(--card);border-radius:8px;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:16px}
th{text-align:left;color:var(--muted);font-weight:600}th,td{padding:6px 4px;border-bottom:1px solid var(--line)}
</style>

t_utilities:'Electricity / water',cat_maintenance:'Equipment maintenance',cat_packaging:'Packaging',cat_admin:'Administrative',cat_other:'Other',recentexp:'Recent expenses',bill:'Billing',billbirds:'Birds (active pens)',billrate:'Rate per bird per month',billmonth:'Amount this month',billstatus:'Status',billtrial:'Free trial until',billpaid:'Paid',billdue:'Due',billpay:'Payment history',nopay:'No payments yet.',admin:'Admin',record:'Record payment',setrate:'Set rate',birdsl:'birds',nowl:'now',editb:'Edit',savedoffline:'Saved on this phone. It will upload when you are online.',needonline:'Connect to the internet to sign in.',offlineview:'You are offline. This screen needs internet. You can still use Log and Sales.',syncfail:'An offline entry could not be uploaded and was dropped:',homet:'Home',logs:'Log',more:'More',moredet:'More details',xactive:'Active pens',xall:'All pens (including closed)',closedtag:'closed',dashtab:'Dashboard',profitm:'Profit, last 30 days',cashbal:'Cash balance',stockm:'Egg stock',cpcm:'Cost per crate',alerts:'Needs attention',noalerts:'Nothing needs attention.',chart14:'Last 14 days: sales (green) and expenses (yellow)',exportt:'Export',savepdf:'Save as PDF',a_stock:'Egg stock is negative: sales are more than the recorded stock',a_cpc:'Cost per crate is up',a_profit:'Profit per day is down compared with the 30 days before',a_sales:'Egg sales per day are down compared with the 30 days before',a_below:'sales below the set price in the last 30 days',e_sales:'Sales',e_exp:'Expenses',e_prod:'Production',e_debts:'Customer debts',e_sup:'Supplier payments',belowp:'Below set price',pricefor:'Price for date',pricecrate:'Egg price per crate (₦)',setprice:'Set price',currentprice:'Current egg price',team:'Team',noteam:'No staff added yet.',newcode:'Create join code',codeis:'Share this code with your staff member:',joinfarm:'Join a farm',code:'Join code',confirmfirst:'Check your email to confirm your account, then sign in.',today:'Today',broken:'Broken eggs (part of the total above)',eused:'Eggs used or given away',brokenbig:'Broken eggs cannot be more than eggs collected.',openeggs:'Opening egg stock (crates)',crates:'crates',stockwarn:'You are selling more than the stock of',saveanyway:'Save anyway?',stock:'Egg stock',ostock:'Opening stock',produced:'Produced',brokenl:'Broken',usedl:'Used / given away',soldl:'Sold',cstock:'Closing stock',prodcost:'Production cost',cpc:'Cost per crate',avgp:'Average selling price per crate',mcrate:'Margin per crate',tmargin:'Total margin (crates sold)',prodcrates:'Crates produced',costnote:'Production cost = feed, labour, medication, transport and other costs, but not administrative costs.',moneytab:'Money',pl:'Profit and loss',revenue:'Egg and other sales',feedused:'Feed used',labourl:'Labour',opprofit:'Operating profit',hensl:'Spent hens sold (not operating income)',incl:'Result including spent hens',cf:'Cash flow',opening:'Opening cash balance (₦)',received:'Cash received',paidout:'Cash paid',closing:'Closing balance',from:'From',to:'To',d7:'7 days',d30:'30 days',mon:'This month',owedby:'Customers owe you (this period)',oweyou:'You owe suppliers (this period)',moneynote:'Profit counts feed by what the hens ate and uses the monthly labour amount if set. Cash flow counts money actually received and paid.'},
  ha:{log:'Rubuta na yau',dash:'Samarwa',pen:'Kwano',date:'Kwanan wata',eggs:'Kwai da aka tara',feed:'Abincin da aka yi amfani da (kg)',expenses:'Kashe-kashe (₦)',med:'Magani',trans:'Sufuri',exp7:'Kashe-kashe, kwanaki 7',dead:'Mutuwa',save:'Adana',saved:'An adana.',hd:'hen-day',drop:'Samar kwai ta ragu da',pts:'maki',nodata:'Babu bayani tukuna.',nopens:'Babu kwano tukuna.',signin:'Shiga',signout:'Fita',email:'Imel',pw:'Kalmar sirri',noFarm:'Ba a haɗa wannan asusu da gona ba tukuna.',farm:'Gona',setup:'Saita gonarka',fname:'Sunan gona',bag:'Nauyin buhun abinci (kg)',price:'Farashin buhu (₦)',pname:'Sunan kwano',birds:'Adadin kaji',addpen:'Ƙara kwano',close:'Rufe',create:'Ƙirƙiri gona',update:'Sabunta',pens:'Kwanuka',confirmClose:'Rufe wannan kwano? Bayanan baya za su kasance.',duties:'Ayyuka',dnew:'Sabon aiki',dname:'Aiki (misali: Ciyar da kaji)',assignee:'Wanda aka ba',dtime:'Lokaci',adddty:'Ƙara aiki',markdone:'An gama',done:'An yi',by:'daga',overdue:'Ya wuce lokaci',undo:'Soke',remove:'Cire',nodut:'Babu ayyuka tukuna.',of:'cikin',sales:'Tallace-tallace',stype:'Abu',t_eggs:'Kwai (crate)',t_hens:'Tsofaffin kaji',t_manure:'Taki',t_other:'Wani',qty:'Adadi',uprice:'Farashin ɗaya (₦)',buyer:'Mai saye (na zaɓi)',addsale:'Adana tallace',total:'Jimla',recent:'Tallace-tallace na kwanan nan',sum7:'Kwanaki 7 da suka wuce',sold:'Tallace',spent:'Kashe-kashe',net:'Riba (kimantawa)',netnote:'Kashe-kashe = abinci + albashi + magani + sufuri.',labour:'Albashin ma’aikata na wata (₦)',nolabour:' Ba a saka albashi ba (shafin Gona).',nofeed:' Ba a saka farashin abinci ba (shafin Gona).',nosales:'Babu tallace-tallace tukuna.',exptab:'Kashe-kashe',moneytab:'Kuɗi',today:'Yau'}
};
const PAY_INFO = 'Pay by bank transfer and send the receipt. Account details: (add yours in index.html)';
const SHOW_SUMMARY = false; // set to true to show the 'Last 7 days' sales/costs/net card on Results
const SHOW_DUTIES = false; // set to true to show the staff duty checklist tab
let lang = 'en', farm = null, pens = [], tab = 'log', role = 'worker';
try { lang = localStorage.getItem('lang') || 'en'; } catch (e) {}
const $ = s => document.querySelector(s);
const t = k => T[lang][k] || T.en[k] || k;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Africa/Lagos' });
try { const th = localStorage.getItem('theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
const themeIcon = () => ({ light: '☀️', dark: '🌙' }[document.documentElement.dataset.theme] || '🌓');
function cycleTheme() {
  const cur = document.documentElement.dataset.theme || 'auto', nx = cur === 'auto' ? 'light' : cur === 'light' ? 'dark' : 'auto';
  if (nx === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = nx;
  try { localStorage.setItem('theme', nx === 'auto' ? '' : nx); } catch (e) {}
}
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const langBtn = () => lang === 'en' ? 'Hausa' : 'English';
function flipLang() { lang = lang === 'en' ? 'ha' : 'en'; try { localStorage.setItem('lang', lang); } catch (e) {} }

let userEmail = '', syncing = false, isAdmin = false;
const isNet = e => /fetch|network|timeout|load failed/i.test((e && e.message) || '');
const getQ = () => { try { return JSON.parse(localStorage.getItem('farmlog_queue') || '[]'); } catch (e) { return []; } };
const setQ = q => { try { localStorage.setItem('farmlog_queue', JSON.stringify(q)); } catch (e) {} };
function updateBadge() { const n = getQ().length, el = $('#pend'); if (el) el.textContent = n ? '⏳ ' + n : ''; }
async function saveOrQueue(kind, row) {
  if (navigator.onLine) {
    const r = kind === 'log' ? await sb.from('daily_logs').upsert(row, { onConflict: 'flock_id,log_date' }) : await sb.from('sales').insert(row);
    if (!r.error || !isNet(r.error)) return { error: r.error, queued: false };
  }
  const q = getQ(); q.push({ kind, row }); setQ(q); updateBadge();
  return { error: null, queued: true };
}
async function syncQueue() {
  if (!navigator.onLine || syncing) return;
  const q = getQ(); if (!q.length) return;
  syncing = true;
  const rest = [];
  for (const it of q) {
    let r = it.kind === 'log' ? await sb.from('daily_logs').upsert(it.row, { onConflict: 'flock_id,log_date' }) : await sb.from('sales').insert(it.row);
    if (r.error && r.error.code === '23505') r = {};
    if (r.error) {
      if (isNet(r.error)) rest.push(it);
      else { it.tries = (it.tries || 0) + 1; if (it.tries < 5) rest.push(it); else alert(t('syncfail') + ' ' + r.error.message); }
    }
  }
  setQ(rest); syncing = false; updateBadge();
}

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  (session || (!navigator.onLine && localStorage.getItem('farmlog_ctx'))) ? load() : renderLogin();
}

async function load() {
  try {
    if (!navigator.onLine) throw new Error('Failed to fetch');
    const { data: { user: me } } = await sb.auth.getUser();
    const { data, error } = await sb.from('app_users').select('role, farms(id, name, bag_kg, feed_price_per_bag, monthly_labour, opening_cash, opening_eggs, rate_per_bird, min_fee, trial_until)').eq('user_id', me.id).maybeSingle();
    if (error) { if (isNet(error)) throw error; renderLogin(error.message); return; }
    if (!data) { renderSetup(); return; }
    farm = data.farms; role = data.role; userEmail = me.email;
    await loadPens();
    try { isAdmin = (await sb.rpc('is_admin')).data === true; } catch (e) {}
    try { localStorage.setItem('farmlog_ctx', JSON.stringify({ farm, role, pens, userEmail })); } catch (e) {}
  } catch (e) {
    let c = null; try { c = JSON.parse(localStorage.getItem('farmlog_ctx')); } catch (x) {}
    if (!c) { renderLogin(isNet(e) ? t('needonline') : e.message); return; }
    farm = c.farm; role = c.role; pens = c.pens; userEmail = c.userEmail;
  }
  tab = role === 'owner' && navigator.onLine ? 'home' : 'log';
  renderApp();
  syncQueue();
}

async function loadPens() {
  const r = await sb.from('flocks').select('id, pen_name, starting_birds').eq('status', 'active').order('pen_name');
  pens = r.data || [];
}

function renderSetup() {
  $('#app').innerHTML = `<main><h1>${t('setup')}</h1><form id="sf">
    <label>${t('fname')}<input id="sn" required></label>
    <label>${t('bag')}<input type="number" id="sb" inputmode="decimal" min="1" step="0.5" value="25" required></label>
    <label>${t('price')}<input type="number" id="sp" inputmode="decimal" min="0"></label>
    <label>${t('pname')}<input id="pn" value="Pen A" required></label>
    <label>${t('birds')}<input type="number" id="pb" inputmode="numeric" min="1" required></label>
    <p class="err" id="er"></p><button class="primary">${t('create')}</button></form>
    <button class="link" id="so">${t('signout')}</button></main>`;
  $('#so').onclick = async () => { await sb.auth.signOut(); renderLogin(); };
  $('#sf').onsubmit = async e => {
    e.preventDefault();
    const { data: id, error } = await sb.rpc('create_farm', {
      p_name: $('#sn').value.trim(), p_bag_kg: +$('#sb').value,
      p_feed_price: $('#sp').value === '' ? null : +$('#sp').value });
    if (error) { $('#er').textContent = error.message; return; }
    const r = await sb.from('flocks').insert({ farm_id: id, pen_name: $('#pn').value.trim(), starting_birds: +$('#pb').value, date_placed: today() });
    if (r.error) { $('#er').textContent = r.error.message; return; }
    load();
  };
}

function renderLogin(msg) {
  $('#app').innerHTML = `<main><h1>Farm Log</h1>
    <form id="lf"><label>${t('email')}<input type="email" id="em" required autocomplete="username"></label>
    <label>${t('pw')}<input type="password" id="pw" required autocomplete="current-password"></label>
    <p class="err" id="er">${msg ? esc(msg) : ''}</p><button class="primary">${t('signin')}</button></form>
    <button class="link" id="lg">${langBtn()}</button><button class="link" id="jn">${t('joinfarm')}</button></main>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
    error ? $('#er').textContent = error.message : load();
  };
  $('#lg').onclick = () => { flipLang(); renderLogin(); };
  $('#jn').onclick = () => renderJoin();
}

function renderJoin(msg) {
  $('#app').innerHTML = `<main><h1>${t('joinfarm')}</h1><form id="jf">
    <label>${t('email')}<input type="email" id="je" required autocomplete="username"></label>
    <label>${t('pw')}<input type="password" id="jp" minlength="6" required autocomplete="new-password"></label>
    <label>${t('code')}<input id="jc2" required autocapitalize="characters"></label>
    <p class="err" id="er">${msg ? esc(msg) : ''}</p><button class="primary">${t('joinfarm')}</button></form>
    <button class="link" id="bk">${t('signin')}</button></main>`;
  $('#bk').onclick = () => renderLogin();
  $('#jf').onsubmit = async e => {
    e.preventDefault();
    const { data, error } = await sb.auth.signUp({ email: $('#je').value.trim(), password: $('#jp').value });
    if (error) { $('#er').textContent = error.message; return; }
    if (!data.session) { $('#er').textContent = t('confirmfirst'); return; }
    const r = await sb.rpc('redeem_code', { p_code: $('#jc2').value });
    if (r.error) { $('#er').textContent = r.error.message; return; }
    load();
  };
}

function renderApp() {
  const owner = role === 'owner';
  const items = owner ? [['home', '🏠', t('homet')], ['log', '📝', t('logs')], ['sales', '🧾', t('sales')], ['money', '💰', t('moneytab')], ['more', '☰', t('more')]]
    : [['log', '📝', t('logs')], ['dash', '📊', t('dash')], ['sales', '🧾', t('sales')]];
  const on = k => k === 'more' ? ['more', 'dash', 'exp', 'farm', 'bill', 'admin'].includes(tab) : tab === k;
  $('#app').innerHTML = `<div class="shell"><header><b>${esc(farm.name)} <span id="pend" style="font-size:14px;color:var(--red);cursor:pointer"></span></b><span><button class="link" id="th">${themeIcon()}</button><button class="link" id="lg">${langBtn()}</button><button class="link" id="so">${t('signout')}</button></span></header><main id="v"></main>
    <div class="tabbar">${items.map(i => `<button data-tab="${i[0]}" class="${on(i[0]) ? 'on' : ''}"><span class="ic">${i[1]}</span>${i[2]}</button>`).join('')}</div></div>`;
  $('#lg').onclick = () => { flipLang(); renderApp(); };
  $('#th').onclick = () => { cycleTheme(); $('#th').textContent = themeIcon(); };
  $('#so').onclick = async () => { await sb.auth.signOut(); renderLogin(); };
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; renderApp(); });
  $('#pend').onclick = syncQueue; updateBadge();
  if (!navigator.onLine && !['log', 'sales', 'more'].includes(tab)) { $('#v').innerHTML = `<p class="err">${t('offlineview')}</p>`; return; }
  ({ home: viewHome, log: viewLog, dash: viewDash, sales: viewSales, exp: viewExpenses, money: () => viewMoney(), duty: viewDuties, farm: viewFarm, bill: viewBilling, admin: viewAdmin, more: viewMore }[tab] || viewLog)();
  placeBar();
}

// keep the bottom bar inside the visible screen (some phone browsers hide part of the page under their own toolbar)
function placeBar() {
  const b = document.querySelector('.bar'), v = window.visualViewport;
  if (b && v) b.style.bottom = Math.max(0, document.documentElement.clientHeight - v.height - v.offsetTop) + 'px';
}
if (window.visualViewport) { visualViewport.addEventListener('resize', placeBar); visualViewport.addEventListener('scroll', placeBar); }
window.addEventListener('scroll', placeBar);

async function viewBilling() {
  $('#v').innerHTML = '<p>…</p>';
  const birds = pens.reduce((q, p) => q + Number(p.starting_birds), 0);
  const rate = Number(farm.rate_per_bird), amount = Math.max(birds * rate, Number(farm.min_fee));
  const r = await sb.from('payments').select('period, amount, method, paid_on').eq('farm_id', farm.id).order('paid_on', { ascending: false }).limit(6);
  const paid = (r.data || []).filter(x => x.period === today().slice(0, 7)).reduce((q, x) => q + Number(x.amount), 0);
  const mn = n => '₦' + Math.round(n).toLocaleString('en-NG');
  const trial = farm.trial_until && today() <= farm.trial_until;
  const status = trial ? `${t('billtrial')} ${farm.trial_until}` : paid >= amount ? t('billpaid') : `${t('billdue')} ${mn(amount - paid)}`;
  const row = (l, v, c) => `<div class="row"><span>${l}</span><b${c ? ` class="${c}"` : ''}>${v}</b></div>`;
  $('#v').innerHTML = `<section>${row(t('billbirds'), birds.toLocaleString('en-NG'))}${row(t('billrate'), mn(rate))}${row(t('billmonth'), mn(amount))}${row(t('billstatus'), status, !trial && paid < amount ? 'err' : 'ok')}<p style="color:var(--muted);font-size:14px;margin:8px 0 0">${esc(PAY_INFO)}</p></section><h2>${t('billpay')}</h2>` +
    ((r.data || []).length ? r.data.map(x => row(`${x.paid_on} · ${x.period}${x.method ? ' · ' + esc(x.method) : ''}`, mn(x.amount))).join('') : `<p>${t('nopay')}</p>`);
}

  const byPen = {};
  (fd.data || []).forEach(x => (byPen[x.pen_name] = byPen[x.pen_name] || []).push(x));
  Object.keys(byPen).forEach(k => { const [a, b] = byPen[k]; if (b && a.hen_day_pct - b.hen_day_pct <= -5) al.push([0, `${k}: ${t('drop')} ${Math.abs(Math.round((a.hen_day_pct - b.hen_day_pct) * 10) / 10)} ${t('pts')}`]); });
  if (cur.closeCr < 0) al.push([0, t('a_stock')]);
  if (prev.cpc > 0 && cur.cpc > prev.cpc * 1.1) al.push([1, `${t('a_cpc')} ${Math.round((cur.cpc / prev.cpc - 1) * 100)}%`]);
  if (prev.profit > 0 && cur.profit / dC < prev.profit / dP * 0.8) al.push([1, t('a_profit')]);
  if (prev.soldCr > 0 && cur.soldCr / dC < prev.soldCr / dP * 0.8) al.push([1, t('a_sales')]);
  if (bp.count > 0) al.push([1, `${bp.count} ${t('a_below')}`]);
  const days = [...Array(14)].map((_, i) => iso(new Date(Date.now() - (13 - i) * 864e5)));
  const sD = d => sum((s14.data || []).filter(x => x.sale_date === d), val), eD = d => sum((e14.data || []).filter(x => x.expense_date === d), x => N(x.amount));
  const mx = Math.max(1, ...days.map(d => Math.max(sD(d), eD(d))));
  const card = (l, v, c) => `<div class="m"><small>${l}</small><b${c ? ` class="${c}"` : ''}>${v}</b></div>`;
  const cr = Math.round(cur.closeCr * 10) / 10;
  $('#v').innerHTML = `<h2>${t('alerts')}</h2>` + (al.length ? al.map(a => `<div class="al${a[0] ? ' w' : ''}">${a[1]}</div>`).join('') : `<p class="ok">${t('noalerts')}</p>`) +
    `<div class="g" style="margin-top:16px">${card(t('profitm'), mn(cur.profit), cur.profit < 0 ? 'err' : 'ok')}${card(t('cashbal'), mn(cur.cash))}${card(t('stockm'), cr + ' ' + t('crates'))}${card(t('cpcm'), mn(cur.cpc))}${card(t('owedtotal'), mn(oC))}${card(t('owing'), mn(oS))}</div>
    <section><div class="bars">${days.map(d => `<div><i style="background:var(--green);height:${sD(d) / mx * 100}%"></i><i style="background:var(--yolk);height:${eD(d) / mx * 100}%"></i></div>`).join('')}</div>
    <p style="color:var(--muted);font-size:14px;margin:8px 0 0">${t('chart14')}</p></section>
    <h2 class="noprint">${t('exportt')}</h2><div class="noprint"><label>${t('from')}<input type="date" id="xf"></label><label>${t('to')}<input type="date" id="xt2"></label><label>${t('pen')}<select id="xp"><option value="active">${t('xactive')}</option><option value="all">${t('xall')}</option>${(fl.data || []).map(x => `<option value="${x.id}">${esc(x.pen_name)}${x.status === 'active' ? '' : ' (' + t('closedtag') + ')'}</option>`).join('')}</select></label>${['sales', 'exp', 'prod', 'debts', 'sup'].map(k => `<button class="link" data-ex="${k}">${t('e_' + k)} (Excel)</button>`).join('')}<button class="link" id="pdf">${t('savepdf')}</button></div>`;
  $('#pdf').onclick = () => window.print();
  const rng = (q, col) => { const f = $('#xf').value, e = $('#xt2').value; if (f) q = q.gte(col, f); if (e) q = q.lte(col, e); return q; };
  const penIds = () => { const v = $('#xp').value; return v === 'active' ? (fl.data || []).filter(x => x.status === 'active').map(x => x.id) : v === 'all' ? (fl.data || []).map(x => x.id) : [v]; };
  const fx = {
    sales: async () => (await rng(sb.from('sales').select('*').eq('farm_id', farm.id).order('sale_date'), 'sale_date')).data.map(x => [x.sale_date, x.type, x.quantity, x.unit_price, val(x), x.buyer, x.payment_method, x.amount_received, val(x) - N(x.amount_received ?? val(x)), x.below_price ? 'yes' : '']),
    exp: async () => (await rng(sb.from('expenses').select('*').eq('farm_id', farm.id).order('expense_date'), 'expense_date')).data.map(x => [x.expense_date, x.category, x.description, x.supplier, x.amount, x.amount_paid, N(x.amount) - N(x.amount_paid)]),
    prod: async () => (await rng(sb.from('flock_daily').select('*').eq('farm_id', farm.id).in('flock_id', penIds()).order('log_date'), 'log_date')).data.map(x => [x.log_date, x.pen_name, x.eggs_good, x.eggs_cracked, x.feed_kg, x.deaths, x.live_birds, x.hen_day_pct]),
    debts: async () => (await rng(sb.from('sales').select('*').eq('farm_id', farm.id).order('sale_date'), 'sale_date')).data.filter(x => val(x) - N(x.amount_received ?? val(x)) > 0.5).map(x => [x.sale_date, x.buyer, val(x), x.amount_received, val(x) - N(x.amount_received)]),
    sup: async () => (await rng(sb.from('expenses').select('*').eq('farm_id', farm.id).order('expense_date'), 'expense_date')).data.filter(x => N(x.amount) - N(x.amount_paid) > 0.5).map(x => [x.expense_date, x.supplier, x.category, x.amount, x.amount_paid, N(x.amount) - N(x.amount_paid)])
  };
  const hd = { sales: ['Date', 'Item', 'Quantity', 'Price each', 'Total', 'Buyer', 'Payment', 'Received', 'Owed', 'Below set price'], exp: ['Date', 'Category', 'Description', 'Supplier', 'Amount', 'Paid', 'Owed'], prod: ['Date', 'Pen', 'Eggs good', 'Eggs broken', 'Feed kg', 'Deaths', 'Live birds', 'Hen-day %'], debts: ['Date', 'Buyer', 'Total', 'Received', 'Owed'], sup: ['Date', 'Supplier', 'Category', 'Amount', 'Paid', 'Owed'] };
  document.querySelectorAll('[data-ex]').forEach(b => b.onclick = async () => { const k = b.dataset.ex; dl(k, [hd[k]].concat(await fx[k]())); });
}

async function eggStock() {
  const [a, b] = await Promise.all([sb.from('daily_logs').select('eggs_good, eggs_used'), sb.from('sales').select('quantity').eq('type', 'eggs')]);
  const sm = (arr, f) => (arr || []).reduce((q, x) => q + Number(f(x)), 0);
  return Number(farm.opening_eggs || 0) + sm(a.data, x => x.eggs_good - x.eggs_used) / 30 - sm(b.data, x => x.quantity);
}

async function viewMoney(from = today().slice(0, 8) + '01', to = today(), dataOnly = false) {
  if (!dataOnly) $('#v').innerHTML = '<p>…</p>';
  const [sl, ex, co, lg, p0, p1, p2, al, es] = await Promise.all([
    sb.from('sales').select('type, quantity, unit_price, amount_received').gte('sale_date', from).lte('sale_date', to),
    sb.from('expenses').select('category, amount, amount_paid').gte('expense_date', from).lte('expense_date', to),
    sb.from('costs').select('type, amount').gte('cost_date', from).lte('cost_date', to),
    sb.from('daily_logs').select('feed_kg').gte('log_date', from).lte('log_date', to),
    sb.from('sales').select('amount_received').lt('sale_date', from),
    sb.from('expenses').select('amount_paid').lt('expense_date', from),
    sb.from('costs').select('amount').lt('cost_date', from),
    sb.from('daily_logs').select('log_date, eggs_good, eggs_cracked, eggs_used').lte('log_date', to),
    sb.from('sales').select('sale_date, quantity').eq('type', 'eggs').lte('sale_date', to)
  ]);
  const N = Number, sum = (a, fn) => (a || []).reduce((q, x) => q + fn(x), 0);
  const val = x => N(x.quantity) * N(x.unit_price);
  const S = sl.data || [], E = ex.data || [];
  const rev = sum(S.filter(x => x.type !== 'hens'), val);
  const hens = sum(S.filter(x => x.type === 'hens'), val);
  const owedC = sum(S, x => val(x) - N(x.amount_received ?? val(x)));
  const days = Math.round((new Date(to) - new Date(from)) / 864e5) + 1;
  const price = N(farm.feed_price_per_bag) || 0;
  const feed = price ? sum(lg.data, x => N(x.feed_kg)) / N(farm.bag_kg) * price : 0;
  const lab = N(farm.monthly_labour) || 0;
  const labour = lab ? lab / 30 * days : sum(E.filter(x => x.category === 'labour'), x => N(x.amount));
  const byCat = {};
  E.forEach(x => { if (x.category !== 'feed' && x.category !== 'labour') byCat[x.category] = (byCat[x.category] || 0) + N(x.amount); });
  (co.data || []).forEach(x => { const c = x.type === 'drugs' ? 'medication' : x.type; if (c !== 'feed' && c !== 'labour') byCat[c] = (byCat[c] || 0) + N(x.amount); });
  const opex = feed + labour + Object.values(byCat).reduce((q, v) => q + v, 0);
  const profit = rev - opex;
  const recv = sum(S, x => N(x.amount_received ?? val(x)));
  const paid = sum(E, x => N(x.amount_paid)) + sum(co.data, x => N(x.amount));
  const open = N(farm.opening_cash) + sum(p0.data, x => N(x.amount_received)) - sum(p1.data, x => N(x.amount_paid)) - sum(p2.data, x => N(x.amount));
  const owedS = sum(E, x => N(x.amount) - N(x.amount_paid));
  const CR = 30, A = al.data || [], ES = es.data || [];
  const inP = a => a.filter(x => (x.log_date || x.sale_date) >= from);
  const prodE = sum(inP(A), x => N(x.eggs_good) + N(x.eggs_cracked)), brokenE = sum(inP(A), x => N(x.eggs_cracked)), usedE = sum(inP(A), x => N(x.eggs_used));
  const soldCr = sum(inP(ES), x => N(x.quantity));
  const openCr = N(farm.opening_eggs) + sum(A.filter(x => x.log_date < from), x => N(x.eggs_good) - N(x.eggs_used)) / CR - sum(ES.filter(x => x.sale_date < from), x => N(x.quantity));
  const closeCr = openCr + (prodE - brokenE - usedE) / CR - soldCr;
  const eggRev = sum(S.filter(x => x.type === 'eggs'), val);
  const prodCost = feed + labour + Object.keys(byCat).filter(c => c !== 'admin').reduce((q, c) => q + byCat[c], 0);
  const cpc = prodE ? prodCost / (prodE / CR) : 0, avgp = soldCr ? eggRev / soldCr : 0;
  const cr = n => (Math.round(n * 10) / 10).toLocaleString('en-NG') + ' ' + t('crates');
  const Q = (l, v, c) => `<div class="row"><span>${l}</span><b${c ? ` class="${c}"` : ''}>${v}</b></div>`;
  const money = n => '₦' + Math.round(n).toLocaleString('en-NG');
  const R = (l, v, c) => `<div class="row"><span>${l}</span><b${c ? ` class="${c}"` : ''}>${money(v)}</b></div>`;
  if (dataOnly) return { profit, cash: open + recv - paid, closeCr, cpc, soldCr, rev };
  $('#v').innerHTML = `<label>${t('from')}<input type="date" id="mf" value="${from}"></label>
    <label>${t('to')}<input type="date" id="mt" value="${to}"></label>
    <nav style="padding:0 0 16px"><button id="m1">${t('today')}</button><button id="m7">${t('d7')}</button><button id="m30">${t('d30')}</button><button id="mm">${t('mon')}</button></nav>
    <section><h2>${t('pl')}</h2>${R(t('revenue'), rev)}${R(t('feedused'), feed)}${R(t('labourl'), labour)}` +
    Object.keys(byCat).map(c => R(t('cat_' + c), byCat[c])).join('') +
    `${R(t('opprofit'), profit, profit < 0 ? 'err' : 'ok')}${R(t('hensl'), hens)}${R(t('incl'), profit + hens)}</section>
    <section><h2>${t('cf')}</h2>${R(t('opening'), open)}${R(t('received'), recv)}${R(t('paidout'), paid)}${R(t('closing'), open + recv - paid, open + recv - paid < 0 ? 'err' : 'ok')}</section>
    <section><h2>${t('stock')}</h2>${Q(t('ostock'), cr(openCr))}${Q(t('produced'), cr(prodE / CR))}${Q(t('brokenl'), cr(brokenE / CR))}${Q(t('usedl'), cr(usedE / CR))}${Q(t('soldl'), cr(soldCr))}${Q(t('cstock'), cr(closeCr), closeCr < 0 ? 'err' : 'ok')}</section>
    <section><h2>${t('cpc')}</h2>${R(t('prodcost'), prodCost)}${Q(t('prodcrates'), cr(prodE / CR))}${R(t('cpc'), cpc)}${R(t('avgp'), avgp)}${R(t('mcrate'), avgp - cpc, avgp - cpc < 0 ? 'err' : 'ok')}${R(t('tmargin'), (avgp - cpc) * soldCr)}<p style="color:var(--muted);font-size:14px;margin:8px 0 0">${t('costnote')}</p></section>
    <section>${R(t('owedby'), owedC)}${R(t('oweyou'), owedS)}<p style="color:var(--muted);font-size:14px;margin:8px 0 0">${t('moneynote')}${price ? '' : t('nofeed')}</p></section>`;
  const go = (f, e) => viewMoney(f, e);
  const iso = d => d.toLocaleDateString('en-CA', { timeZone: 'Africa/Lagos' });
  $('#mf').onchange = $('#mt').onchange = () => go($('#mf').value, $('#mt').value);
  $('#m1').onclick = () => go(today(), today());
  $('#m7').onclick = () => go(iso(new Date(Date.now() - 6 * 864e5)), today());
  $('#m30').onclick = () => go(iso(new Date(Date.now() - 29 * 864e5)), today());
  $('#mm').onclick = () => go(today().slice(0, 8) + '01', today());
}

async function viewDuties() {
  $('#v').innerHTML = '<p>…</p>';
  const [d, c] = await Promise.all([
    sb.from('duties').select('id, name, assignee, due_time').eq('active', true).order('due_time', { ascending: true, nullsFirst: false }),
    sb.from('duty_checks').select('duty_id, done_at, done_by').eq('check_date', today())
  ]);
  if (d.error) { $('#v').innerHTML = `<p class="err">${esc(d.error.message)}</p>`; return; }
  const duties = d.data || [], checks = {};
  (c.data || []).forEach(x => checks[x.duty_id] = x);
  const hm = x => new Date(x).toLocaleTimeString('en-GB', { timeZone: 'Africa/Lagos', hour: '2-digit', minute: '2-digit' });
  const nowHm = hm(Date.now());
  const doneCount = duties.filter(x => checks[x.id]).length;
  let h = duties.length ? `<h2>${doneCount} ${t('of')} ${duties.length} ${t('done').toLowerCase()}</h2>` : `<p>${t('nodut')}</p>`;
  h += duties.map(x => {
    const k = checks[x.id];
    const late = !k && x.due_time && nowHm > x.due_time.slice(0, 5);
    return `<section><b>${esc(x.name)}</b><div style="color:var(--muted);font-size:16px">${x.assignee ? esc(x.assignee) : ''}${x.due_time ? ' · ' + x.due_time.slice(0, 5) : ''}</div>` +
      (k ? `<p class="ok">✓ ${t('done')} ${hm(k.done_at)} ${t('by')} ${esc(k.done_by || '')}</p>${role === 'owner' ? `<button class="link" data-undo="${x.id}">${t('undo')}</button>` : ''}`
         : `${late ? `<p class="err">${t('overdue')}</p>` : ''}<button class="primary" data-done="${x.id}">${t('markdone')}</button>`) +
      (role === 'owner' ? `<button class="link" data-rm="${x.id}">${t('remove')}</button>` : '') + `</section>`;
  }).join('');
  if (role === 'owner') h += `<form id="df" style="margin-top:20px"><h2>${t('dnew')}</h2>
    <label>${t('dname')}<input id="dn" required></label>
    <label>${t('assignee')}<input id="da"></label>
    <label>${t('dtime')}<input type="time" id="dt2"></label>
    <p id="dm" class="err"></p><button class="primary">${t('adddty')}</button></form>`;
  $('#v').innerHTML = h;
  document.querySelectorAll('[data-done]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const { data: { user } } = await sb.auth.getUser();
    await sb.from('duty_checks').insert({ duty_id: b.dataset.done, check_date: today(), done_by: user.email });
    viewDuties();
  });
  document.querySelectorAll('[data-undo]').forEach(b => b.onclick = async () => {
    await sb.from('duty_checks').delete().eq('duty_id', b.dataset.undo).eq('check_date', today());
    viewDuties();
  });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
    if (!confirm(t('remove') + '?')) return;
    await sb.from('duties').update({ active: false }).eq('id', b.dataset.rm);
    viewDuties();
  });
  if ($('#df')) $('#df').onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.from('duties').insert({ farm_id: farm.id, name: $('#dn').value.trim(), assignee: $('#da').value.trim() || null, due_time: $('#dt2').value || null });
    if (error) { $('#dm').textContent = error.message; return; }
    viewDuties();
  };
}

function viewFarm() {
  $('#v').innerHTML = `<form id="ff"><h2>${t('farm')}</h2>
    <label>${t('bag')}<input type="number" id="bg" inputmode="decimal" min="1" step="0.5" value="${farm.bag_kg}" required></label>
    <label>${t('price')}<input type="number" id="pr" inputmode="decimal" min="0" value="${farm.feed_price_per_bag ?? ''}"></label>
    <label>${t('labour')}<input type="number" id="lb" inputmode="numeric" min="0" value="${farm.monthly_labour ?? ''}"></label>
    <label>${t('opening')}<input type="number" id="oc" inputmode="decimal" value="${farm.opening_cash ?? 0}"></label>
    <label>${t('openeggs')}<input type="number" id="oe" inputmode="decimal" min="0" step="any" value="${farm.opening_eggs ?? 0}"></label>
    <p id="fm" role="status"></p><button class="primary">${t('update')}</button></form>
    <h2 style="margin-top:28px">${t('pens')}</h2>
    ${pens.map(p => `<div class="row"><span><b>${esc(p.pen_name)}</b> · <span id="pc_${p.id}">${Number(p.starting_birds).toLocaleString('en-NG')} ${t('birdsl')}</span></span><span><button class="link" data-eb="${p.id}">${t('editb')}</button><button class="link" data-id="${p.id}">${t('close')}</button></span></div>`).join('')}
    <form id="pf" style="margin-top:16px"><label>${t('pname')}<input id="pn" required></label>
    <label>${t('birds')}<input type="number" id="pb" inputmode="numeric" min="1" required></label>
    <p id="pm" role="status"></p><button class="primary">${t('addpen')}</button></form>`;
  $('#ff').onsubmit = async e => {
    e.preventDefault();
    const price = $('#pr').value === '' ? null : +$('#pr').value;
    const lab = $('#lb').value === '' ? null : +$('#lb').value;
    const { error } = await sb.from('farms').update({ bag_kg: +$('#bg').value, feed_price_per_bag: price, monthly_labour: lab, opening_cash: +$('#oc').value || 0, opening_eggs: +$('#oe').value || 0 }).eq('id', farm.id);
    $('#fm').className = error ? 'err' : 'ok';
    $('#fm').textContent = error ? error.message : t('saved');
    if (!error) { farm.bag_kg = +$('#bg').value; farm.feed_price_per_bag = price; farm.monthly_labour = lab; farm.opening_cash = +$('#oc').value || 0; farm.opening_eggs = +$('#oe').value || 0; }
  };
  $('#pf').onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.from('flocks').insert({ farm_id: farm.id, pen_name: $('#pn').value.trim(), starting_birds: +$('#pb').value, date_placed: today() });
    if (error) { $('#pm').className = 'err'; $('#pm').textContent = error.message; return; }
    await loadPens(); viewFarm();
  };
  document.querySelectorAll('[data-id]').forEach(b => b.onclick = async () => {
    if (!confirm(t('confirmClose'))) return;
    const { error } = await sb.from('flocks').update({ status: 'closed' }).eq('id', b.dataset.id);
    if (!error) { await loadPens(); viewFarm(); }
  });
  sb.from('daily_logs').select('flock_id, deaths').in('flock_id', pens.map(p => p.id)).then(r => pens.forEach(p => {
    const d = (r.data || []).filter(x => x.flock_id === p.id).reduce((q, x) => q + Number(x.deaths), 0), el = document.getElementById('pc_' + p.id);
    if (el) el.textContent = `${Number(p.starting_birds).toLocaleString('en-NG')} ${t('birdsl')}` + (d ? ` · ${t('nowl')} ${(p.starting_birds - d).toLocaleString('en-NG')}` : '');
  }));
  document.querySelectorAll('[data-eb]').forEach(b => b.onclick = async () => {
    const p = pens.find(x => x.id === b.dataset.eb), n = prompt(`${p.pen_name}: ${t('birds')}`, p.starting_birds);
    if (n === null || !(+n > 0)) return;
    const { error } = await sb.from('flocks').update({ starting_birds: Math.round(+n) }).eq('id', p.id);
    if (!error) { await loadPens(); viewFarm(); }
  });
  viewTeam();
}
